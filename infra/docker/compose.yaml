services:
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${DB_ADMIN_USER:-${PGUSER}}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      PGUSER: ${PGUSER}
    ports: ["127.0.0.1:${DB_LOCAL_PORT:-${PGPORT}}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
  seed:
    image: ${APP_IMAGE:-prostapaper:local}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: app
    profiles: [tools]
    command: [node, seed.mjs]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGSSLMODE: disable
    read_only: true
    cap_drop: [ALL]
    depends_on:
      db: { condition: service_healthy }
  seed-users:
    image: ${APP_IMAGE:-prostapaper:local}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: app
    profiles: [tools]
    command: [node, seed-users.mjs]
    env_file:
      - path: ${API_ENV_FILE:-./apps/api/.env}
        format: raw
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGSSLMODE: disable
    read_only: true
    cap_drop: [ALL]
    depends_on:
      db: { condition: service_healthy }
  app:
    image: ${APP_IMAGE:-prostapaper:local}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: app
    env_file:
      - path: ${API_ENV_FILE:-./apps/api/.env}
        format: raw
    environment:
      NODE_ENV: production
      PORT: "3000"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGSSLMODE: disable
    ports: ["127.0.0.1:${WEB_PORT:-8080}:3000"]
    depends_on:
      db: { condition: service_healthy }
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
volumes:
  postgres-data:
