name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Optional retained sha256 digest for rollback; blank builds current main"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  check:
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
      KNIP_REPORTER: github-actions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check # Same task graph locally and in CI.
      - name: Identify PR runtime changes
        id: runtime
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
          if grep -vE '(^docs/|\.md$)' "$RUNNER_TEMP/changed-files" > /dev/null; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-compose-action@2fe291b7677a45ee1269ec56a42604c143505e7e # v1
        if: steps.runtime.outputs.changed == 'true'
        with:
          version: v5.6.0
      - name: Smoke-test PR containers without AWS
        if: steps.runtime.outputs.changed == 'true'
        run: pnpm test:containers
  redcap-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/redcap/requirements.txt
      - run: python -m unittest discover -s tools/redcap -p 'test_*.py'
  terraform-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: node infra/check-terraform-format.mjs
      - name: Validate both stacks without AWS credentials
        run: |
          for stack in infra/bootstrap infra/environments/demo; do
            terraform -chdir="$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$stack" validate
          done
  deploy:
    needs: [check, redcap-tools, terraform-validate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEMO_DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
      queue: max
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: eu-central-1
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - name: Skip superseded revisions
        id: current
        run: |
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          [ -n "$head" ] || { echo 'Cannot resolve main.' >&2; exit 1; }
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo "Main is at $head; skipping this revision." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.current.outputs.current == 'true'
      - uses: actions/setup-node@v4
        if: steps.current.outputs.current == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        if: steps.current.outputs.current == 'true'
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-
      - run: pnpm install --frozen-lockfile
        if: steps.current.outputs.current == 'true'
      - uses: hashicorp/setup-terraform@v3
        if: steps.current.outputs.current == 'true'
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        if: steps.current.outputs.current == 'true'
        with:
          role-to-assume: arn:aws:iam::000000000000:role/prostapaper-demo-github-deploy
          role-session-name: image-${{ github.run_id }}
          aws-region: eu-central-1
          allowed-account-ids: "000000000000"
      - name: Select repository and log in
        id: repository
        if: steps.current.outputs.current == 'true'
        env:
          REQUESTED_DIGEST: ${{ inputs.image_digest }}
        run: |
          if [ -n "$REQUESTED_DIGEST" ] && ! [[ "$REQUESTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Provide a sha256 digest from the app ECR repository.' >&2
            exit 1
          fi
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "url=$registry/prostapaper-demo-app" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
      - name: Build application outputs with Turbo
        if: steps.current.outputs.current == 'true'
        run: pnpm build
      - uses: docker/setup-buildx-action@v3
        if: steps.current.outputs.current == 'true' && inputs.image_digest == ''
      - uses: docker/build-push-action@v7
        id: image
        if: steps.current.outputs.current == 'true' && inputs.image_digest == ''
        with:
          context: .
          file: infra/docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.repository.outputs.url }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - uses: docker/setup-compose-action@2fe291b7677a45ee1269ec56a42604c143505e7e # v1
        if: steps.current.outputs.current == 'true'
        with:
          version: v5.6.0
      - uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        if: steps.current.outputs.current == 'true'
        with:
          role-to-assume: arn:aws:iam::000000000000:role/prostapaper-demo-github-terraform
          role-session-name: ecs-${{ github.run_id }}
          aws-region: eu-central-1
          allowed-account-ids: "000000000000"
      - name: Deploy with Terraform and ECS health-based rollback
        id: deployment
        if: steps.current.outputs.current == 'true'
        env:
          APP_IMAGE: ${{ steps.repository.outputs.url }}@${{ inputs.image_digest || steps.image.outputs.digest }}
          TF_VAR_image_uri: ${{ steps.repository.outputs.url }}@${{ inputs.image_digest || steps.image.outputs.digest }}
        run: |
          # The published image smoke test runs alongside the plan; apply waits for both.
          pnpm test:production > "$RUNNER_TEMP/smoke.log" 2>&1 &
          smoke=$!
          cd infra/environments/demo
          terraform init -input=false -lockfile=readonly
          terraform plan -input=false -out="$RUNNER_TEMP/demo.tfplan"
          terraform show -json "$RUNNER_TEMP/demo.tfplan" > "$RUNNER_TEMP/demo.plan.json"
          # Resolve the planned task's SSM secrets and run the API's own env schema before anything changes.
          (cd ../.. && pnpm --filter @prostapaper/api check:deploy-env "$RUNNER_TEMP/demo.plan.json")
          wait "$smoke" || { cat "$RUNNER_TEMP/smoke.log" >&2; exit 1; }
          cat "$RUNNER_TEMP/smoke.log"
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          [ "$head" = "$GITHUB_SHA" ] || { echo 'Main advanced; skipping deployment.'; exit 0; }
          terraform apply -input=false "$RUNNER_TEMP/demo.tfplan"
          cluster="$(terraform output -raw ecs_cluster)"
          service="$(terraform output -raw ecs_service)"
          expected="$(terraform output -raw task_definition_arn)"
          actual="$(aws ecs describe-services --cluster "$cluster" --services "$service" --query 'services[0].taskDefinition' --output text)"
          [ "$actual" = "$expected" ] || { echo 'ECS rolled back the failed deployment.' >&2; exit 1; }
          url="$(terraform output -raw website_url)"
          curl --fail --silent --show-error --retry 5 "$url/api/health"
          curl --fail --silent --show-error --retry 5 "$url/api/ready"
          echo "Deployed $TF_VAR_image_uri to $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Report failed ECS deployment
        if: failure() && steps.deployment.outcome == 'failure'
        run: |
          aws ecs describe-services --cluster prostapaper-demo --services app \
            --query 'services[0].{deployments:deployments,events:events[:15]}'
          tasks="$(aws ecs list-tasks --cluster prostapaper-demo --service-name app --desired-status STOPPED --query 'taskArns' --output text)"
          if [ -n "$tasks" ] && [ "$tasks" != None ]; then
            aws ecs describe-tasks --cluster prostapaper-demo --tasks $tasks \
              --query 'tasks[].{task:taskArn,definition:taskDefinitionArn,reason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}'
          fi
          aws logs tail /ecs/prostapaper-demo --since 15m --format short
